name: Deploy naar Hostinger

# Elke wijziging op main gaat automatisch live naar alieke.design.
# Dus ook elke wijziging die je opslaat in het beheerscherm (alieke.design/admin).
# Handmatig starten kan via Actions → Deploy naar Hostinger → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen testen of de verbinding werkt (niets uploaden)'
        type: boolean
        default: false

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Controleer secrets
        env:
          LIVE_USER: ${{ secrets.FTP_LIVE_USERNAME }}
        run: |
          if [ -z "$LIVE_USER" ]; then echo "::error::Secret FTP_LIVE_USERNAME ontbreekt"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Upload met maximaal drie pogingen: Hostinger reageert soms niet op tijd (FTP-timeout).
      - name: Upload naar Hostinger via FTP (poging 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_LIVE_USERNAME }}
          password: ${{ secrets.FTP_LIVE_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

      - name: Even wachten
        if: steps.ftp1.outcome == 'failure'
        run: sleep 20

      - name: Upload naar Hostinger via FTP (poging 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_LIVE_USERNAME }}
          password: ${{ secrets.FTP_LIVE_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

      - name: Nog even wachten
        if: steps.ftp2.outcome == 'failure'
        run: sleep 40

      - name: Upload naar Hostinger via FTP (poging 3)
        if: steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_LIVE_USERNAME }}
          password: ${{ secrets.FTP_LIVE_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
