name: Deploy naar Hostinger

# Twee bestemmingen:
# - test (nieuw.alieke.design): automatisch bij elke wijziging op main.
# - live (alieke.design): alleen handmatig, via Actions → Deploy naar Hostinger →
#   Run workflow → kies "live". Zo gaat er nooit per ongeluk iets live.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Waar naartoe? test = nieuw.alieke.design, live = alieke.design'
        type: choice
        options: [test, live]
        default: test

concurrency:
  group: deploy-${{ inputs.target || 'test' }}
  cancel-in-progress: false

env:
  IS_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'live' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Bestemming
        env:
          LIVE_USER: ${{ secrets.FTP_LIVE_USERNAME }}
        run: |
          if [ "$IS_LIVE" = "true" ]; then
            echo "Bestemming: LIVE (alieke.design)"
            if [ -z "$LIVE_USER" ]; then echo "::error::Secret FTP_LIVE_USERNAME ontbreekt"; exit 1; fi
          else
            echo "Bestemming: test (nieuw.alieke.design)"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Upload met maximaal drie pogingen: Hostinger reageert soms niet op tijd (FTP-timeout).
      - name: Upload naar Hostinger via FTP (poging 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ env.IS_LIVE == 'true' && secrets.FTP_LIVE_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ env.IS_LIVE == 'true' && secrets.FTP_LIVE_PASSWORD || secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000

      - name: Even wachten
        if: steps.ftp1.outcome == 'failure'
        run: sleep 20

      - name: Upload naar Hostinger via FTP (poging 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ env.IS_LIVE == 'true' && secrets.FTP_LIVE_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ env.IS_LIVE == 'true' && secrets.FTP_LIVE_PASSWORD || secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000

      - name: Nog even wachten
        if: steps.ftp2.outcome == 'failure'
        run: sleep 40

      - name: Upload naar Hostinger via FTP (poging 3)
        if: steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ env.IS_LIVE == 'true' && secrets.FTP_LIVE_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ env.IS_LIVE == 'true' && secrets.FTP_LIVE_PASSWORD || secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          timeout: 60000
