name: Deploy naar Hostinger

# Draait automatisch bij elke wijziging op main, en handmatig via
# Actions → Deploy naar Hostinger → Run workflow.
# LET OP: zolang de FTP-secrets naar het testadres (nieuw.alieke.design) wijzen
# is dat veilig. Zet 'push' weer uit vóór de overstap naar alieke.design.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Upload met maximaal drie pogingen: Hostinger reageert soms niet op tijd (FTP-timeout).
      - name: Upload naar Hostinger via FTP (poging 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 60000

      - name: Even wachten
        if: steps.ftp1.outcome == 'failure'
        run: sleep 20

      - name: Upload naar Hostinger via FTP (poging 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 60000

      - name: Nog even wachten
        if: steps.ftp2.outcome == 'failure'
        run: sleep 40

      - name: Upload naar Hostinger via FTP (poging 3)
        if: steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          timeout: 60000
