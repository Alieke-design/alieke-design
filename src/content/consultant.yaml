# Teksten van de pagina AI Design Consultant (alieke.design/ai-design-consultant).
# Aanpassen via alieke.design/admin (of hier). *Sterretjes* om woorden = gele cirkel eromheen.
seo:
  title: AI Design Consultant - Alieke.design
  description: Eén designbasis voor de hele organisatie, klaar om zelf met AI mee te werken. Met beheer en review door een senior designer.
  ogImageAlt: AI Design Consultant Alieke Zelhorst

hero:
  label: AI Design Consultant
  titel: Je designproces,
  titelAccent: klaar voor AI
  intro: 'Ik breng het proces in je organisatie:'
  punten:
    - vet: 'op orde:'
      tekst: van losse bestanden naar een bron van waarheid
    - vet: 'op eigen kracht:'
      tekst: elk team ontwerpt snel en on-brand met AI
    - vet: 'op niveau:'
      tekst: beheer van de bron en review van complex werk
  knop: Bekijk de aanpak

waarom:
  label: Waarom
  titel: Alles is anders
  ondertitel: AI vraagt om een nieuw designproces
  tekst: 'AI maakt in minuten wat vroeger dagen kostte. Maar AI bedenkt niets zelf: het bouwt voort op de context die het krijgt. Rommelige context wordt rommelig werk.'
  kernzin: 'Het nieuwe proces is simpel: één *design system* als bron, elk team ontwerpt ermee, een *senior designer* bewaakt het.'

aanpak:
  label: Aanpak
  titel: In vijf stappen
  ondertitel: Naar efficiëntie en kwaliteit
  stappen:
    - titel: Scan
      frequentie: Eenmalig
      tekst: Wat er ligt, wat klopt, wat dubbel is, wat ontbreekt.
    - titel: Fundament
      frequentie: Eenmalig
      tekst: Eén design system als bron van waarheid, klaar voor AI-tools.
    - titel: Overdracht
      frequentie: Eenmalig
      tekst: Je team gaat zelf aan de slag met de basis en AI.
    - titel: Beheer
      frequentie: Doorlopend
      tekst: Eén vast punt voor wijzigingen, zodat de bron blijft kloppen.
    - titel: Review
      frequentie: Doorlopend
      tekst: Een senior designer checkt wat AI maakt voor het live gaat.

resultaat:
  label: Resultaat
  titel: Dit staat er straks
  ondertitel: Gebouwd op wat er al is, *geen rebranding*
  tip: |-
    Behoefte aan een nieuwe branding?
    Laten we het erover hebben.
  punten:
    - titel: Eén design system
      tekst: De bron van waarheid waar mens én AI uit werken.
      optioneel: false
    - titel: Een team dat zelf aan de slag kan
      tekst: Snel, on-brand en met heldere afspraken.
      optioneel: false
    - titel: Een beheer- en reviewproces
      tekst: Kwaliteit op senior niveau, ook als tools en mensen veranderen.
      optioneel: true

scan:
  label: Stap 1
  titel: De scan
  intro: Alle andere stappen bouwen op de scan. Daarom begint het hier.
  toolsTip: 'Tools zoals Canva, PowerPoint, Mailchimp, Adobe of ChatGPT. Ik bekijk alles wat erin ontworpen wordt, van social post tot poster: logo, kleur, lettertype, vormen en opbouw.'
  wcagTitel: Toegankelijkheidsscan
  wcagTip: Ik toets alle designs op contrast, leesbaarheid, klikdoelen, focus en formulieren. Geen technische audit van de code.
  pakketten:
    - naam: Klein
      doelgroep: Eén team
      prijsLabel: vaste prijs
      prijs: € 1.250
      gesprek: Gesprek online
      producten: 1 website of app
      tools: Uitingen uit 1 tot 2 tools
      wcagPrijs: € 500
      wcagVanaf: false
    - naam: Midden
      doelgroep: Meerdere teams
      prijsLabel: vaste prijs
      prijs: € 2.750
      gesprek: Gesprekken online of op locatie
      producten: 1 tot 2 websites of apps
      tools: Uitingen uit 2 tot 3 tools
      wcagPrijs: € 1.000
      wcagVanaf: false
    - naam: Groot
      doelgroep: Meerdere teams of afdelingen
      prijsLabel: vanaf
      prijs: € 4.500
      gesprek: Gesprekken op locatie
      producten: Meerdere websites of apps
      tools: Uitingen uit meerdere tools
      wcagPrijs: € 1.500
      wcagVanaf: true
  resultaat:
    label: Resultaat
    titel: Na de scan heb je dit in handen
    rapportVet: 'Een helder rapport:'
    rapportTekst: in kaart gebracht wat er ligt.
    planVet: Een plan met vaste prijs
    planTekst: 'voor de vervolgstappen:'

wie:
  label: Wie er komt
  naam: Alieke Zelhorst
  punten:
    - Senior UX/UI designer met 15 jaar ervaring
    - Gediplomeerd WCAG-specialist
    - Design systems bij o.a. Risk en Heineken
  quote: She immediately started creating *structure* and *consistency* in our chaos.
  quoteNaam: Rik van Duijn
  quoteRol: senior developer bij Tired of Cancer
  knop: Over mij

contact:
  label: Contact
  titel: Eerst kennismaken
  tekst: Je gaat met mij in zee, dus laten we eerst kijken of het klikt.
  punten:
    - Eerst een half uur online kennismaken
    - Dan een plan en prijs voor de scan
    - Akkoord? Dan ga ik van start
  menuNote: Je krijgt binnen een werkdag reactie.
