titel: Alles is anders
ondertitel: AI vraagt om een nieuw designproces
tekst: 'AI maakt in minuten wat vroeger dagen kostte. Maar AI bedenkt niets zelf: het bouwt voort op de context die het krijgt. Rommelige context wordt rommelig werk.'
