  - name: Rik van Duijn
    role: React Native Developer @ Tired of Cancer
    photo: /src/assets/img/aanbevelingen/rik.webp
    lang: en
    linkedin: ""
    text: |-
      Alieke is the best designer I have ever worked with. She stepped into the Untire project and immediately started creating structure and consistency in our chaos. Her designs don't just look beautiful; they are practical and aligned with the technology. As a developer, I'm often at the end of the line trying to implement technically uninformed designs to the pixel. With Alieke, the experience was completely different. We often worked closely together, making pragmatic decisions that would yield the best outcome with the least technical effort. The result: a complex app that is nonetheless both beautiful and user-friendly, designed and built in a very ambitious timeline that could only have worked when design and development work hand in hand.
  - name: Bas Tromp
    role: Owner @ Opreis.nl
    photo: /src/assets/img/aanbevelingen/bas.webp
    lang: nl
    linkedin: ""
    text: |-
      Alieke heeft onze verwachtingen overtroffen bij het redesign van de Opreis.nl website. Binnen no-time wist ze de brei aan informatie en wensen te structureren en op een manier weer te geven die duidelijk en prettig is voor de bezoekers, en tevens voor een hogere conversie zorgt. De samenwerking was leuk en efficiënt, deadlines werden gehaald en de kwaliteit van het werk was bovenal top. Ik raad het iedereen aan om Alieke in te schakelen voor een complex UX/UI project.
  - name: Ajay Kharade
    role: Seasoned Agile Leader @ Heineken
    photo: /src/assets/img/aanbevelingen/ajay.webp
    lang: en
    linkedin: ""
    text: |-
      I have worked with quite a few UI/UX designers in the past years, and undoubtedly Alieke is one of the bests of them. Alieke was a lead designer for a strategic and very challenging project, we did together that lasted for about an year.

      Her creative thinking, customer first approach and ONLY THE BEST attitude massively improved our customer facing product, making it simple, attractive and easy to use. I often saw her raising the bar for herself and also inspired others, with smile and positivity all around. She is truly a team member, takes ownership and makes things happen in time and with possibly best quality.

      It was pleasure and privilege to work with Alieke and I would highly recommend and endorse her.

      Wishing you the best, Alieke.
  - name: Bob Hennis
    role: Informatieanalist @ Zorg en Zekerheid
    photo: /src/assets/img/aanbevelingen/bob.webp
    lang: nl
    linkedin: ""
    text: |-
      Alieke is een topdesigner! Ik heb 2,5 jaar heel prettig met Alieke samengewerkt binnen een Agile SCRUM team bij Zorg en Zekerheid. Zowel op het gebied van interaction design als visual design levert zij altijd kwaliteit.

      Voor het tonen van gegevens in onze app had ik als informatieanalist de taak om complexe informatie en situaties in kaart te brengen. De uitdaging was om deze complexe situaties zo begrijpelijk mogelijk aan klanten te tonen. Daarvoor moet je keuzes maken en soms bepaalde zaken weglaten of versimpelen. Alieke was onmisbaar bij het maken van deze keuzes.

      Alieke staat snel 'boven de materie', mede doordat ze de juiste vragen stelt. Zij kan daardoor goed hoofd- en bijzaken scheiden en komt elke keer met originele oplossingen. Ook kan zij zich goed verplaatsen in de klant (in ons geval verzekerden) en de wensen van de organisatie en dat is ook terug te zien in haar werk. Haar designs zijn van hoge kwaliteit, strak en eigentijds.

      Daarnaast is Alieke ook gewoon een hele gezellige collega, ook zeker niet onbelangrijk!
  - name: Aron Schilder
    role: Founder @ Recruit Robin
    photo: /src/assets/img/aanbevelingen/aron.webp
    lang: en
    linkedin: ""
    text: |-
      WOW! It was often the first reaction of our team, when reviewing Alieke's latest design for our product. We worked with Alieke for 18 months and besides the amazing designs, she teached us the process of how you design a user driven product. To us, the most valuable learning.
      The result of our collaboration? When we ask users feedback on our product, they always start complimenting us on the user-friendliness of our product.
      @Alieke: we hope to have you back on board one day and wish you all the best for the future!
