# Sectie "Over mij": drie lijsten. Aanpassen via alieke.design/admin (of hier).
# Gebruik <b>…</b> voor vetgedrukte woorden.
werkwijze:
  - Door de spil te zijn tussen stakeholders en developers
  - Door usertests te organiseren, uitvoeren en analyseren
  - Door AI prototypes te bouwen die ideeën snel valideren
  - Door het designproces van A tot Z te dragen
  - Door focus op het allerbeste resultaat
  - Door een open houding en een glimlach 😀

resultaat:
  - Structuur en een heldere aanpak
  - <b>Intuïtieve designs</b> die getest zijn met gebruikers
  - <b>Strakke designs</b> met een passende look &amp; feel
  - <b>Toegankelijke designs</b> die voldoen aan de WCAG-normen
  - <b>Consistente designs</b> die gebaseerd zijn op een Design System
  - <b>AI producten</b> van werkend naar wérkelijk goed

voorWie:
  - De zorg, van interne systemen tot medical devices
  - Teams die AI producten naar een hoger niveau willen tillen
  - Organisaties die toegankelijkheid en inclusiviteit serieus nemen
  - Iedereen met een mooie uitdaging en een goed verhaal
